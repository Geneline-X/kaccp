<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="title desc">
  <title id="title">KACCP architecture</title>
  <desc id="desc">Audio moves through five human stages — speaker records, reviewer checks audio,
  transcriber writes the transcript, reviewer approves the text, language lead verifies — before
  becoming an exportable dataset. Beneath sits a Next.js application with role-scoped API routes,
  a domain and infrastructure layer, PostgreSQL, and pluggable storage that can be local
  filesystem or cloud object storage.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b9c0cc"/>
    </marker>
    <style>
      .h1    { font-size: 25px; font-weight: 700; fill: #14171f; }
      .sub   { font-size: 14px; fill: #6b7383; }
      .band  { font-size: 11px; font-weight: 700; fill: #99a1b0; letter-spacing: 1.4px; }
      .node  { font-size: 14px; font-weight: 600; fill: #14171f; }
      .small { font-size: 11.5px; fill: #6b7383; }
      .tiny  { font-size: 10.5px; fill: #8b93a1; }
      .white { fill: #ffffff; }
      .chip  { font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1240" height="900" fill="#ffffff"/>

  <!-- ─────────────── header ─────────────── -->
  <text x="48" y="52" class="h1">KACCP — how it fits together</text>
  <text x="48" y="76" class="sub">Human review is the architecture. Every recording is heard by at least two people before it can leave the system.</text>

  <!-- ─────────────── band 1: the human pipeline ─────────────── -->
  <text x="48" y="122" class="band">THE PIPELINE — WHO DOES WHAT</text>

  <rect x="40" y="136" width="1160" height="150" rx="12" fill="#fafbfd" stroke="#e6eaf1"/>

  <!-- stage 1 speaker -->
  <rect x="64" y="162" width="176" height="98" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="92" cy="190" r="13" fill="#3b82f6"/>
  <text x="92" y="195" class="white chip" text-anchor="middle">1</text>
  <text x="116" y="195" class="node">Speaker</text>
  <text x="80" y="222" class="small">Records audio against</text>
  <text x="80" y="238" class="small">a curated prompt</text>
  <text x="80" y="252" class="tiny">paid per accepted minute</text>

  <!-- stage 2 audio review -->
  <rect x="264" y="162" width="176" height="98" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <circle cx="292" cy="190" r="13" fill="#f59e0b"/>
  <text x="292" y="195" class="white chip" text-anchor="middle">2</text>
  <text x="316" y="195" class="node">Reviewer</text>
  <text x="280" y="222" class="small">Checks the audio:</text>
  <text x="280" y="238" class="small">clarity, noise, language</text>
  <text x="280" y="252" class="tiny">can reject or flag</text>

  <!-- stage 3 transcriber -->
  <rect x="464" y="162" width="176" height="98" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <circle cx="492" cy="190" r="13" fill="#8b5cf6"/>
  <text x="492" y="195" class="white chip" text-anchor="middle">3</text>
  <text x="516" y="195" class="node">Transcriber</text>
  <text x="480" y="222" class="small">Writes down what</text>
  <text x="480" y="238" class="small">was actually said</text>
  <text x="480" y="252" class="tiny">paid per approved item</text>

  <!-- stage 4 text review -->
  <rect x="664" y="162" width="176" height="98" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <circle cx="692" cy="190" r="13" fill="#f59e0b"/>
  <text x="692" y="195" class="white chip" text-anchor="middle">4</text>
  <text x="716" y="195" class="node">Reviewer</text>
  <text x="680" y="222" class="small">Reads transcript</text>
  <text x="680" y="238" class="small">against the audio</text>
  <text x="680" y="252" class="tiny">feedback returned on reject</text>

  <!-- stage 5 language lead -->
  <rect x="864" y="162" width="176" height="98" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="892" cy="190" r="13" fill="#10b981"/>
  <text x="892" y="195" class="white chip" text-anchor="middle">5</text>
  <text x="916" y="195" class="node">Language Lead</text>
  <text x="880" y="222" class="small">Final verification</text>
  <text x="880" y="238" class="small">before release</text>
  <text x="880" y="252" class="tiny">admin role</text>

  <!-- dataset -->
  <rect x="1064" y="162" width="112" height="98" rx="10" fill="#14171f"/>
  <text x="1120" y="200" class="white node" text-anchor="middle">Dataset</text>
  <text x="1120" y="222" text-anchor="middle" font-size="11" fill="#9aa3b2">CSV · JSON</text>
  <text x="1120" y="238" text-anchor="middle" font-size="11" fill="#9aa3b2">WAV · LJSpeech</text>

  <!-- arrows between stages -->
  <line x1="244" y1="211" x2="260" y2="211" stroke="#8b93a1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="444" y1="211" x2="460" y2="211" stroke="#8b93a1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="644" y1="211" x2="660" y2="211" stroke="#8b93a1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="844" y1="211" x2="860" y2="211" stroke="#8b93a1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1044" y1="211" x2="1060" y2="211" stroke="#8b93a1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- reject path -->
  <path d="M 352 264 L 352 278 L 152 278 L 152 264" fill="none" stroke="#d1a355"
        stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowLight)"/>
  <text x="252" y="275" class="tiny" text-anchor="middle" fill="#a97f2e">rejected · re-record</text>

  <path d="M 752 264 L 752 278 L 552 278 L 552 264" fill="none" stroke="#d1a355"
        stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowLight)"/>
  <text x="652" y="275" class="tiny" text-anchor="middle" fill="#a97f2e">rejected · re-transcribe</text>

  <!-- ─────────────── band 2: application ─────────────── -->
  <text x="48" y="330" class="band">APPLICATION — NEXT.JS 16, ROLE-SCOPED API ROUTES</text>

  <rect x="40" y="344" width="1160" height="122" rx="12" fill="#fafbfd" stroke="#e6eaf1"/>

  <rect x="64" y="368" width="206" height="74" rx="9" fill="#ffffff" stroke="#dbe1ea"/>
  <text x="84" y="394" class="node">Speaker app</text>
  <text x="84" y="414" class="small">prompts · record · wallet</text>
  <text x="84" y="430" class="tiny">/api/v2/speaker</text>

  <rect x="288" y="368" width="206" height="74" rx="9" fill="#ffffff" stroke="#dbe1ea"/>
  <text x="308" y="394" class="node">Transcriber app</text>
  <text x="308" y="414" class="small">claim · transcribe · translate</text>
  <text x="308" y="430" class="tiny">/api/v2/transcriber</text>

  <rect x="512" y="368" width="206" height="74" rx="9" fill="#ffffff" stroke="#dbe1ea"/>
  <text x="532" y="394" class="node">Reviewer app</text>
  <text x="532" y="414" class="small">approve · reject · feedback</text>
  <text x="532" y="430" class="tiny">/api/v2/reviewer</text>

  <rect x="736" y="368" width="206" height="74" rx="9" fill="#ffffff" stroke="#dbe1ea"/>
  <text x="756" y="394" class="node">Admin app</text>
  <text x="756" y="414" class="small">languages · payouts · export</text>
  <text x="756" y="430" class="tiny">/api/v2/admin</text>

  <rect x="960" y="368" width="216" height="74" rx="9" fill="#ffffff" stroke="#dbe1ea"/>
  <text x="980" y="394" class="node">Pipeline</text>
  <text x="980" y="414" class="small">external audio · review queue</text>
  <text x="980" y="430" class="tiny">/api/v2/pipeline</text>

  <!-- auth strip -->
  <rect x="40" y="480" width="1160" height="40" rx="9" fill="#14171f"/>
  <text x="64" y="505" class="white" font-size="13" font-weight="600">Auth &amp; authorisation</text>
  <text x="228" y="505" font-size="12" fill="#9aa3b2">JWT (RFC 7519) · bcrypt · role checked server-side on every request, never only in the UI</text>

  <!-- ─────────────── band 3: libraries ─────────────── -->
  <text x="48" y="566" class="band">LIBRARIES — RULES SEPARATED FROM PLUMBING</text>

  <rect x="40" y="580" width="566" height="104" rx="12" fill="#fafbfd" stroke="#e6eaf1"/>
  <text x="64" y="608" class="node">lib/domain — business rules</text>
  <text x="64" y="632" class="small">payments · dataset export shaping · gamification scoring</text>
  <text x="64" y="652" class="tiny">Kept out of route handlers so CLI scripts and tests reuse the same logic.</text>
  <text x="64" y="670" class="tiny">A dataset built by script and by the UI is identical by construction.</text>

  <rect x="634" y="580" width="566" height="104" rx="12" fill="#fafbfd" stroke="#e6eaf1"/>
  <text x="658" y="608" class="node">lib/infra — plumbing</text>
  <text x="658" y="632" class="small">db · auth · storage · cache · rate-limit</text>
  <text x="658" y="652" class="tiny">Storage is an interface, not a vendor. Prisma client is process-cached and</text>
  <text x="658" y="670" class="tiny">connection-capped, because each route deploys as its own process.</text>

  <!-- ─────────────── band 4: persistence ─────────────── -->
  <text x="48" y="730" class="band">PERSISTENCE</text>

  <rect x="40" y="744" width="360" height="120" rx="12" fill="#ffffff" stroke="#dbe1ea"/>
  <text x="64" y="774" class="node">PostgreSQL 15+</text>
  <text x="64" y="796" class="small">21 models · Prisma schema + migrations</text>
  <text x="64" y="816" class="tiny">The only required data store. No proprietary database,</text>
  <text x="64" y="834" class="tiny">no opaque format — open schema, direct SQL access.</text>

  <rect x="424" y="744" width="470" height="120" rx="12" fill="#ffffff" stroke="#dbe1ea"/>
  <text x="448" y="774" class="node">Audio storage — pluggable</text>
  <rect x="448" y="788" width="196" height="54" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="464" y="810" font-size="12.5" font-weight="600" fill="#0f7b4f">Local filesystem</text>
  <text x="464" y="828" class="tiny" fill="#3f8168">open source · zero accounts</text>
  <rect x="660" y="788" width="212" height="54" rx="8" fill="#f6f8fb" stroke="#dbe1ea"/>
  <text x="676" y="810" font-size="12.5" font-weight="600" fill="#4a5568">Cloud object storage</text>
  <text x="676" y="828" class="tiny">GCS today · S3/MinIO = one file</text>

  <rect x="918" y="744" width="282" height="120" rx="12" fill="#fafbfd" stroke="#e6eaf1"/>
  <text x="942" y="774" class="node">Audio access</text>
  <text x="942" y="798" class="small">Signed URLs only</text>
  <text x="942" y="818" class="tiny">read 1 hour · write 15 minutes</text>
  <text x="942" y="838" class="tiny">Never a public bucket. No permanent link.</text>

  <!-- connectors down the stack -->
  <line x1="620" y1="466" x2="620" y2="478" stroke="#c3cad6" stroke-width="1.6" marker-end="url(#arrowLight)"/>
  <line x1="620" y1="520" x2="620" y2="576" stroke="#c3cad6" stroke-width="1.6" marker-end="url(#arrowLight)"/>
  <line x1="220" y1="686" x2="220" y2="740" stroke="#c3cad6" stroke-width="1.6" marker-end="url(#arrowLight)"/>
  <line x1="917" y1="686" x2="700" y2="740" stroke="#c3cad6" stroke-width="1.6" marker-end="url(#arrowLight)"/>

  <!-- footnote -->
  <text x="48" y="886" class="tiny">
    Minimum open deployment: PostgreSQL + local storage + manual transcription. Every proprietary integration — cloud storage, AI assist, translation, mobile money — is optional and selected by environment variable.
  </text>
</svg>
